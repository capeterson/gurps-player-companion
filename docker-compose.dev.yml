name: nimble-rocket-29ef18d6

services:
  deps:
    image: oven/bun:1.2-alpine
    working_dir: /app
    restart: 'no'
    command: ['bun', 'install', '--frozen-lockfile']
    volumes:
      - ./:/app
      - bun_modules:/app/node_modules

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gurps
      POSTGRES_PASSWORD: gurps
      POSTGRES_DB: gurps
    ports:
      - '${GPC_DB_PORT:-5434}:5432'
    volumes:
      - db_data_dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gurps -d gurps']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: oven/bun:1.2-alpine
    working_dir: /app
    restart: 'no'
    command: ['bun', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgres://gurps:gurps@db:5432/gurps
      JWT_SECRET: dev-only-secret-replace-me-replace-me-replace-me
    volumes:
      - ./:/app
      - bun_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  app:
    image: oven/bun:1.2-alpine
    working_dir: /app
    command: ['bun', 'run', 'dev']
    environment:
      ENVIRONMENT: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://gurps:gurps@db:5432/gurps
      JWT_SECRET: dev-only-secret-replace-me-replace-me-replace-me
      JWT_ACCESS_TTL_MINUTES: 15
      JWT_REFRESH_TTL_DAYS: 14
      CORS_ORIGINS: '[]'
      APP_BASE_URL: http://localhost:${GPC_APP_PORT:-3001}
      OAUTH_CLIENTS: '[]'
      # Vite HMR client runs in the *host* browser, so it must connect
      # back to the host-mapped port, not the container's internal 3000.
      # See vite.config.ts `server.hmr`.
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: '${GPC_APP_PORT:-3001}'
    volumes:
      - ./:/app
      - bun_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${GPC_APP_PORT:-3001}:3000'

  client-tests:
    image: node:22-alpine
    profiles: ['test']
    working_dir: /app
    command: ['node', 'scripts/run-client-tests.mjs']
    volumes:
      - ./:/app
      - bun_modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  db_data_dev:
  bun_modules:
