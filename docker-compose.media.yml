# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.media.yml up -d
# For dev use scripts/dev-worktree.sh -f docker-compose.media.yml up -d.
# Each Compose project gets its own volumes; no storage ports are published.
services:
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?Set a Garage access key}
      GARAGE_DEFAULT_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?Set a Garage secret key}
      GARAGE_DEFAULT_BUCKET: ${MEDIA_S3_BUCKET:-gpc-images}
      GARAGE_RPC_SECRET: ${MEDIA_GARAGE_RPC_SECRET:?Set a 32-byte hex RPC secret}
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - ${MEDIA_METADATA_DIR:-media_metadata}:/var/lib/garage/meta
      - ${MEDIA_DATA_DIR:-media_data}:/var/lib/garage/data
  app:
    environment:
      MEDIA_S3_ENDPOINT: http://garage:3900
      MEDIA_S3_REGION: garage
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-gpc-images}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?Set a Garage access key}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?Set a Garage secret key}
      MEDIA_S3_PATH_STYLE: 'true'
    depends_on:
      garage:
        condition: service_started
volumes:
  media_metadata:
  media_data:
