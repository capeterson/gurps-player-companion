  - name: Greyhaven Promise
    kind: disadvantage
    basePoints: -7
    description: |-
      Everyone who signed the Greyhaven charter swore the same short vow: *a rescued traveler reaches a safe harbor before the rescuer takes new pay.*

      - **In play:** see a rescued person to real safety (escort, shelter or an agreed handover) before accepting unrelated paid work.
      - **When routes conflict:** spend a scene arranging that handover rather than abandoning the traveler.
      - **Limits:** the vow never demands a suicidal rescue; breaking it costs trust, contacts and commissions.
    key: traits_6
