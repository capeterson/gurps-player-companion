  - name: Counts the gulls
    kind: quirk
    basePoints: -1
    description: Before setting sail, count the visible gulls for about a minute and announce a personal omen.
      The omen is a habit, not supernatural information, a weather roll, or a navigation modifier. If a hurried
      departure prevents the count, the character remains unsettled until a safe pause permits a substitute ritual.
      The player and GM adjudicate the interruption; the app applies no blanket anxiety penalty.
