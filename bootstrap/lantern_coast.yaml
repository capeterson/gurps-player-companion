          text: The GM confirms a clear account with witness claims separated from rumor.
          'on': success
        - kind: note
          text: The account confuses sources or omits a key point; the GM adjudicates correction and audience
            response.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
