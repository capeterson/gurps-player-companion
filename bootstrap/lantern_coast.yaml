    difficulty: A
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -5
    description: '**Move unseen.** The following task modifier is an explicit campaign example.'
    procedures:
      modifiers:
      - id: noisy_ground
        label: Loose shingle underfoot
        when:
        - input:
            domain: environment
            key: loose_shingle
            label: Loose shingle underfoot
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
      actions:
      - id: slip_past
        label: Slip past the lookout
        roll:
          basis: skill
        contest:
          kind: quick
          opponent: Horizon Watch
        outcomes:
        - kind: note
          text: Reach cover if the contest is won; the GM resolves the opponent.
          'on': success
      benefits:
      - id: practiced_scout
        label: Practiced coastal scout
        when:
          minimumRelativeLevel: 2
        effects: []
        sourceText: Narrative campaign milestone; no automatic numerical bonus.
    key: skills_7
    sourceKey: lantern_training
