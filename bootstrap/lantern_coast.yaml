# Original synthetic coastal fantasy fixtures; all sourcebooks and locators are fictional.
version: 13
campaign:
  name: The Lantern Coast
  description: Six companions follow a vanished beacon through Greyhaven’s tide caves. Original coastal fantasy
    rules inspired by the broad character-building, equipment and ritual-magic patterns of tabletop sourcebooks;
    no published entries or page references are reproduced.
  pointTarget: 250
  disadvantageCap: 50
  quirkCap: 5
  manaLevel: normal
  techLevel: 3
  skillPrerequisitePolicy: warn
  enforceAttributeCaps: true
  houseRules:
    ruleSet: none
    protectNaturalDr: false
library:
  traits:
  - name: Breakwater Poise
    kind: advantage
    basePoints: 12
    effects:
    - target: parry
      value: 1
    - target: will
      value: 1
    description: A trained breakwater guard keeps a steady weapon line and resists panic. The sheet applies +1
      Parry and +1 Will at all times; these are the entire numerical benefit, with no surprise immunity, extra
      defense, or faster reaction. A guard may spend a minute showing the stance to a companion, but instruction
      does not transfer the bonus. The GM still resolves loss of footing, fear circumstances, and whether a weapon
      can parry.
    key: traits_1
    sourceKey: lantern_lives
    status: complete
    role: definition
    calculation:
      version: 1
      inputs: []
      tables: []
      nodes:
      - id: points
        op: constant
        value: 12
      outputs:
      - key: points
        node: points
        unit: points
        rounding: exact
        increment: 1
        min: -1000
        max: 1000
    sourceLocator: traits.1
    source: LCGV traits.1
  - name: Longwatch Lungs
    kind: advantage
    basePoints: 7
    description: Breathing drills and paced exertion provide one additional FP, already included in the sheet
      maximum. This reserve can pay ordinary exertion or magic costs; it is not free breathing underwater, immunity
      to smoke, or faster recovery. A quiet watch is a good opportunity to rest, but recovery time and fatigue
      expenditure remain the normal campaign rules. Record any extra exertion manually rather than treating this
      as an inexhaustible watch.
    effects:
    - target: fp
      value: 1
    key: traits_2
    sourceKey: lantern_lives
    status: complete
    role: definition
    calculation:
