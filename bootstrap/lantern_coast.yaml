  - name: Dockside Scrapping
    attribute: DX
    difficulty: E
    defaults: []
    description: |-
      Dockside scrapping is what crews learn between shifts: grabs, shoves and short holds that end a quarrel before anyone draws steel.

      - **Use:** unarmed grapples, holds and shoves; the skill has no default, so it must be learned.
      - **Time:** one attempt per turn.
      - **Penalty:** -2 when a crowded workbench or cargo stack obstructs movement.
    key: skills_6
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.6
    source: LCST skills.6
    procedures:
      modifiers:
      - id: dockside_scrapping_obstacle
        label: A crowded workbench obstructs movement
        when:
        - input:
            domain: environment
            key: dockside_scrapping_obstacle
            label: A crowded workbench obstructs movement
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: dockside_scrapping_task
        label: Attempt a dockside hold
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 1
          unit: seconds
        outcomes:
        - kind: note
          text: The GM resolves the hold and records any restraint manually; this is not automatic injury.
          'on': success
        - kind: note
          text: The hold is not established; the GM describes the opening or a critical mishap.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
  - name: Shingle Ghosting
    attribute: DX
    difficulty: A
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -5
    description: |-
      Shingle ghosting is the coast scout's craft of crossing loose stone and wet sand without a sound, keeping to the shadow of the cliff.

      - **Use:** move unseen and unheard past a lookout, or set up a hidden vantage point.
      - **Penalty:** -2 on loose shingle underfoot.
      - **Benefit:** at relative level +2 or better, the scout is recognized as a practiced coastal scout by the keeper stations.
    procedures:
      modifiers:
      - id: noisy_ground
        label: Loose shingle underfoot
        when:
        - input:
            domain: environment
            key: loose_shingle
            label: Loose shingle underfoot
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
      actions:
      - id: slip_past
        label: Slip past the lookout
        roll:
          basis: skill
        contest:
          kind: quick
          opponent: Horizon Watch
        outcomes:
        - kind: note
          text: Reach cover if the contest is won; the GM resolves the opponent.
          'on': success
      benefits:
      - id: practiced_scout
        label: Practiced coastal scout
        when:
          minimumRelativeLevel: 2
        effects: []
        sourceText: Narrative campaign milestone; no automatic numerical bonus.
    key: skills_7
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.7
    source: LCST skills.7
  - name: Coastal Foraging
    attribute: Per
    difficulty: A
    specializationPolicy:
      kind: required_catalog
      options:
      - name: Cliff Gardens
        description: Ledge gardens of samphire, sea kale and wild thyme, plus the rain cisterns the old keepers
          carved into the rock. Reaching an exposed ledge needs Cliff Traverse first.
      - name: Tide Flats
        description: Cockle beds, mussel ropes and the safe paths across the mud between tides. The flats are
          generous and quick to drown the careless.
    defaults:
    - kind: attribute
      attribute: Per
      modifier: -5
    description: |-
      The coast feeds those who know where to look: samphire on the cliff ledges, cockles in the flats, rainwater in the old stone cisterns.

      - **Specialization required:** Cliff Gardens or Tide Flats.
      - **Time:** one hour of careful gathering in the learned habitat.
      - **Penalty:** -2 when the gathering patch shows contamination.
      - **Result:** success finds enough for a modest meal or a useful sample; quantity depends on the season and the patch.
    key: skills_8
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.8
    source: LCST skills.8
    procedures:
      modifiers:
      - id: coastal_foraging_obstacle
        label: The gathering patch shows contamination
        when:
        - input:
            domain: environment
            key: coastal_foraging_obstacle
            label: The gathering patch shows contamination
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: coastal_foraging_task
        label: Gather from the learned habitat
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 1
          unit: hours
        outcomes:
        - kind: note
          text: The GM identifies a modest local find and records its quantity and condition manually.
          'on': success
        - kind: note
          text: No dependable find is secured; the GM decides whether time, exposure, or a suspect sample matters.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
  - name: Horizon Watch
    attribute: Per
    difficulty: A
    defaults:
    - kind: attribute
      attribute: Per
      modifier: -5
    description: |-
      Lookouts sweep the horizon in a fixed rhythm: left to right, sky to sea, then the shore. They read shapes, sails and lights long before anyone else.

      - **Use:** spot ships, signals, weather fronts and movement on the water or shore.
      - **Time:** one minute for a full sweep.
      - **Penalty:** -2 when dense mist obscures the horizon.
    key: skills_9
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.9
    source: LCST skills.9
    procedures:
      modifiers:
      - id: horizon_watch_obstacle
        label: Dense mist obscures the horizon
        when:
