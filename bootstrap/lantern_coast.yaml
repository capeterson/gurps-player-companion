  - name: Lantern vigil
    kind: quirk
    basePoints: -1
    description: At a safe evening halt, spend a minute lighting a small candle or explaining why no flame can
      be spared. The ritual honors named people lost along the coast and can start a conversation with other
      mourners. It offers no ward, divination, fear resistance, or numerical benefit. Forgetting it is a roleplaying
