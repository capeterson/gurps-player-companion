  - name: Bridgekeeper Oath
    kind: disadvantage
    basePoints: -8
    description: |-
      The Stonebridge masons keep crossings open in floods and wars alike. Their oath is old enough that the village still pays it in bread.

      - **In play:** let refugees cross without toll, and repair or make restitution for any damage you cause to a public crossing.
      - **Scale:** a reasonable repair or arranged restitution, not every damaged bridge on the coast.
      - **When refused:** consequences arrive through people, guild standing and access, not as a skill penalty.
