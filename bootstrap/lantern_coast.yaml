  - name: Bell Tuning
    attribute: IQ
    difficulty: A
    defaults:
    - kind: attribute
      attribute: IQ
      modifier: -5
    - kind: skill
      name: Signal Weaving
      specialization:
        kind: any
      modifier: -4
    description: At the learned TL, compare and adjust an ordinary signal bell against a reference tone. One
      small adjustment takes thirty minutes with a suitable tool and permission to work on the bell. Heavy background
      noise gives the penalty. Success restores a plausible recognizable tone, not a magical resonance or greater
      communication range. The GM records material limits, access, damage, and whether the bell needs a specialist
      casting repair.
    procedures:
      modifiers:
      - id: bell_tuning_obstacle
        label: Heavy harbor noise obscures the reference
        when:
        - input:
            domain: environment
            key: bell_tuning_obstacle
            label: Heavy harbor noise obscures the reference
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: bell_tuning_task
        label: Tune a signal bell
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 30
          unit: minutes
        outcomes:
        - kind: note
          text: The GM records an ordinary bell tone that matches the available reference within practical limits.
          'on': success
        - kind: note
          text: The tone remains wrong or the adjustment risks damage; the GM decides rework manually.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
