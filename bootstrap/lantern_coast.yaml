      attribute: DX
      modifier: -5
    description: |-
      Salvage hafts began as wreckers' tools: a hook, a spike and a heavy head on a stout pole. Dock fighters still prefer them to anything forged for war.

      - **Use:** melee attacks and parries with axes, hooks and similar hafted weapons, in each of the weapon's modes.
      - **Time:** one attack per turn.
      - **Penalty:** -2 when wreckage shifts underfoot.
