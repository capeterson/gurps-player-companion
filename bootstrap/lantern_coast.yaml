    kind: perk
    basePoints: 1
    description: A tiny salt-tolerant garden gives a concrete hobby and an excuse to trade cuttings with gardeners.
      With an hour of care and local materials, the character may preserve one ordinary plant cutting during
      travel, subject to the GM's assessment of weather and storage. It cannot feed a crew, create medicinal
      effects, or replace Coastal Foraging. Plant condition, gifts, and contacts are manually adjudicated; no
