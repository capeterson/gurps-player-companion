  races:
  - name: Selkie-blooded
    description: |-
      Somewhere in a selkie-blooded family tree is a grey seal who came ashore and stayed a while. Their descendants are sleek-haired and dark-eyed, swim as easily as they walk, and on the right night can take the sealskin form of their ancestor.

      - **On the sheet:** +1 HT and +1 Will, plus Cold-Water Hardy and Pull of the Sea.
      - **Racial training:** Current Riding.
      - **Alternate form:** Seal form, which keeps the race's cost.
    kind: race
    points: 26
    attributeModifiers:
      ht: 1
      will: 1
    traits:
    - key: cold-water-hardy
      name: Cold-Water Hardy
      kind: advantage
      points: 5
      level: null
      description: Ignores the fatigue and HT penalties of cold water and sea spray.
      effects: []
    - key: sealskin-memory
      name: Sealskin Memory
      kind: advantage
      points: 10
      level: null
      description: Can shift into Seal form once per night, taking about a minute; returning takes the same.
      effects: []
    - key: pull-of-the-sea
      name: Pull of the Sea
      kind: disadvantage
      points: -5
      level: null
      description: Must spend at least an hour in the sea every few days or become restless and short-tempered.
      effects: []
    skills:
    - specialization: null
      techLevel: null
      key: current-riding
      name: Current Riding
      attribute: HT
      difficulty: E
      points: 1
      description: Learned in the water before learned on land.
    features:
    - Hair is always slightly damp to the touch.
    - Eyes reflect light like a seal's at night.
    effects: []
    variants: []
    forms:
    - key: seal-form
      name: Seal form
      description: A large grey seal, fast and graceful in water and clumsy on land. Gear does not transform;
        it stays where it fell.
      points: 26
      attributeModifiers:
        dx: -2
        move: -3
        ht: 1
      traits:
      - key: cold-water-hardy
        name: Cold-Water Hardy
        kind: advantage
        points: 5
        level: null
        description: Ignores the fatigue and HT penalties of cold water.
        effects: []
      - key: seal-swimmer
        name: Seal Swimmer
        kind: advantage
        points: 10
        level: null
        description: Water Move 6 and can hold breath for ten minutes.
        effects: []
      - key: no-hands
        name: Flippers
        kind: disadvantage
        points: -15
        level: null
        description: Cannot use tools or weapons; can carry small objects in the mouth.
        effects: []
      skills: []
      features:
      - Cannot speak in seal form; can still sing Tidesong.
      effects: []
    compatibleRaceKeys: []
    removesTraits: []
    removesSkills: []
    tags:
    - coastal
    - fae
    key: lc_selkie_blooded
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: races.2
    source: LCGV races.2
  - name: Shoalborn
    description: |-
      Families who have fished, piloted and salvaged the Lantern Coast shoals for twenty generations. They are broad-handed, salt-weathered and comfortable in cold water. Most never learn to sleep well on land.

      - **On the sheet:** +1 HT and +1 Per, plus Shoal Breath, Salt-Squint and the Landsick quirk.
      - **Racial training:** Current Riding.
    kind: race
    points: 24
    attributeModifiers:
      ht: 1
      per: 1
    traits:
    - key: shoal-breath
      name: Shoal Breath
      kind: advantage
      points: 4
      level: 2
      description: Hold breath twice as long as normal, enough to free a fouled anchor or reach a trapped swimmer.
      effects: []
    - key: salt-squint
      name: Salt-Squint
      kind: advantage
      points: 5
      level: null
      description: No vision penalties from glare off water, snow or white sand.
      effects: []
    - key: landsick
      name: Landsick
      kind: quirk
      points: -1
      level: null
      description: Sleeps poorly more than a day's walk from the sea and says so.
      effects: []
    skills:
    - specialization: null
      techLevel: null
      key: current-riding
      name: Current Riding
      attribute: HT
      difficulty: E
      points: 1
      description: Every Shoalborn child learns to ride a rip before they can read.
    features:
    - Hands are broad and calloused; most Shoalborn can be recognized by their grip.
    effects: []
    variants:
    - key: fogward
      name: Fogward Shoalborn
      description: The northern bell-tower families, raised in near-constant fog. They trade some of their sea-sense
        for keen ears.
      points: 20
      attributeModifiers:
        ht: 1
      traits:
      - key: fog-ear
        name: Fog Ear
        kind: advantage
        points: 6
        level: 3
        description: +3 to Hearing rolls; Fogward bellkeepers can judge distance by echo.
        effects: []
      - key: shoal-breath
        name: Shoal Breath
        kind: advantage
        points: 4
        level: 2
        description: Hold breath twice as long as normal.
        effects: []
      - key: landsick
        name: Landsick
        kind: quirk
        points: -1
        level: null
        description: Sleeps poorly more than a day's walk from the sea and says so.
        effects: []
      skills:
      - specialization: null
        techLevel: null
        key: current-riding
        name: Current Riding
        attribute: HT
        difficulty: E
        points: 1
        description: Every Shoalborn child learns to ride a rip before they can read.
      features:
      - Fogward families wear bell charms braided into their hair.
      effects: []
    forms: []
    compatibleRaceKeys: []
    removesTraits: []
    removesSkills: []
    tags:
    - coastal
    key: lc_shoalborn
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: races.1
    source: LCGV races.1
  - name: Tide-touched
    description: |-
      Some who drown on the Lantern Coast come back. The sea leaves them a little colder, a little quieter, and able to hear the beacons sing.

      - **Applies to:** any race, including Human.
      - **On the sheet:** +1 Will and the Beacon Hum trait (+1 Beacon Resonance).
