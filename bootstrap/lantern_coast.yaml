  - name: Reedbow
    attribute: DX
    difficulty: H
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -5
    description: |-
      Reedbows are short, layered bows of steamed marsh reed and horn. They are cheap to build, quick to string and treacherous in a crosswind.

      - **Use:** ranged attacks with reedbows; accuracy, range and damage come from the bow's shot modes.
      - **Time:** one shot per turn after readying an arrow.
      - **Penalty:** -2 when a strong crosswind cuts across the firing lane.
    key: skills_3
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.3
    source: LCST skills.3
    procedures:
      modifiers:
      - id: reedbow_obstacle
        label: Strong crosswind crosses the firing lane
        when:
