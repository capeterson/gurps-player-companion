    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.7
    source: LCST skills.7
  - name: Coastal Foraging
    attribute: Per
    difficulty: A
    specializationPolicy:
      kind: required_catalog
      options:
      - name: Cliff Gardens
        description: Survey one accessible cliff garden for familiar edible plants and usable rain traps during
          an hour of careful searching. Reaching a ledge requires a separate climbing task; this specialization
          does not make unstable ground safe. Use the shared Coastal Foraging task procedure, including its
          -2 penalty when the player and GM confirm contamination in the gathering patch. Success offers a
          plausible local find, not conjured rations or proof that every plant or water source is harmless.
          The GM adjudicates seasonal growth, runoff, spoilage and collection limits, then records supplies,
          travel time and any consequences manually; the action does not alter inventory or physical state.
      - name: Tide Flats
        description: Search one accessible tidal patch for familiar shellfish and a feasible gathering route
          during an hour of careful work. Learn local tidal access separately from cliff gathering; success
          does not certify a permanent safe channel or identify every hidden toxin. Use the shared Coastal
          Foraging task procedure, including its -2 penalty when the player and GM confirm contamination in
          the gathering patch. The GM decides the tide window, mud hazards, available quantity and spoilage,
          and whether an unfamiliar specimen needs another expert. Record gathered supplies, consumed time
          and exposure manually; the action does not create inventory or automatically change physical state.
    defaults:
    - kind: attribute
      attribute: Per
      modifier: -5
    description: 'Survey one accessible patch for food or water during an hour of careful searching. Learn Cliff
      Gardens and Tide Flats separately: cliff practice covers edible plants and rain traps, while flats practice
      covers shellfish and safe gathering channels. A contaminated patch imposes the declared task penalty. The
      GM decides quantity, spoilage, tidal access, and whether unfamiliar material is safe; a success does not
      conjure rations or diagnose every toxin. Record any supplies and travel time manually.'
    key: skills_8
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.8
    source: LCST skills.8
    procedures:
      modifiers:
      - id: coastal_foraging_obstacle
        label: The gathering patch shows contamination
        when:
        - input:
            domain: environment
            key: coastal_foraging_obstacle
            label: The gathering patch shows contamination
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: coastal_foraging_task
        label: Gather from the learned habitat
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 1
