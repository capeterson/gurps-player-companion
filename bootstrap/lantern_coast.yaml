  - name: Echo Collector
    kind: disadvantage
    basePoints: -6
    availableModifiers:
    - name: Trusted companion intervenes
      category: limitation
      costType: percent
      costValue: -30
    description: |-
      An unfamiliar beacon echo is a puzzle that will not wait. Mira has stopped mid-chase to sketch a rhythm she may never hear again.

      - **In play:** on hearing a new echo, pause about ten minutes to record its pattern, or explain aloud why you will not.
      - **Trusted companion intervenes (-30%):** a named companion's direct warning lets you defer the pause this once.
      - **Payoff:** a recorded echo is a genuine clue for later Beacon Resonance work, though never a free success.
