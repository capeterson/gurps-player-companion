  - name: Beacon Resonance
    attribute: IQ
    difficulty: VH
    prerequisiteRules:
      kind: all
      children:
      - kind: attribute
        attribute: IQ
        minimum: 12
      - kind: trait
        name: Magery (Tideglass attunement)
        minimumLevel: 0
    defaults:
    - kind: attribute
      attribute: IQ
      modifier: -7
    description: |-
      Every beacon on the Lantern Coast hums with a pattern laid into its tideglass lens. A resonant can hear that pattern, judge whether it is healthy, and sometimes recognize who laid it.

      - **Use:** examine a beacon pulse, diagnose a ward or compare one tideglass working against another.
      - **Time:** ten minutes of undisturbed examination.
      - **Penalty:** -2 when the beacon lens is cracked.
      - **Synergy:** each level of Tideglass attunement adds +1.
    key: skills_12
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.12
    source: LCST skills.12
    procedures:
      modifiers:
      - id: beacon_resonance_obstacle
        label: The beacon lens is cracked
        when:
        - input:
            domain: equipment
            key: beacon_resonance_obstacle
            label: The beacon lens is cracked
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: beacon_resonance_task
        label: Examine a beacon pulse
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 10
          unit: minutes
        outcomes:
        - kind: note
          text: The GM identifies a plausible resonance pattern or a specific missing reference.
          'on': success
        - kind: note
          text: The reading is inconclusive or misleading; the GM resolves any dangerous exposure manually.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
