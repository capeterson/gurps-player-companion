          text: The specimen is misidentified or unresolved; the GM records uncertainty rather than a guaranteed
            answer.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
    key: skills_45
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.45
    source: LCST skills.45
  - name: Storm Drill
    attribute: IQ
    difficulty: A
    defaults:
    - kind: attribute
      attribute: IQ
      modifier: -5
    - kind: skill
      name: Harbor Winchcraft
      specialization:
        kind: any
      modifier: -4
    description: |-
      Storm drills are practiced until they are boring, so that when the real storm comes nobody has to think.

      - **Use:** rehearse and run storm responses: securing boats, evacuating quays and manning winches.
      - **Time:** about ten minutes per rehearsal.
      - **Penalty:** -2 when the crew has not worked together before.
      - **Benefit:** at relative level +2, sustained drilling grants +1 Rescue Coordination.
    procedures:
      modifiers:
      - id: storm_drill_obstacle
        label: The crew has not worked together before
        when:
        - input:
            domain: familiarity
            key: storm_drill_obstacle
            label: The crew has not worked together before
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: storm_drill_task
        label: Rehearse a storm response
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 10
          unit: minutes
        outcomes:
        - kind: note
          text: The GM records an understood plan and the next specific preparation step.
          'on': success
        - kind: note
          text: A role or safety step is missed; the GM identifies the gap before an actual storm.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
      benefits:
      - id: cross_training
        label: Practiced rescue coordination
        when:
          minimumRelativeLevel: 2
        effects:
        - target: skill
          skillName: Rescue Coordination
          value: 1
        sourceText: At relative level +2, sustained training grants +1 Rescue Coordination; no other skill receives
          this benefit.
    key: skills_46
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.46
    source: LCST skills.46
  - name: Silent Signing
    attribute: DX
    difficulty: A
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -5
    - kind: skill
      name: Signal Weaving
      specialization:
        kind: any
      modifier: -4
    description: |-
      Harbor Sign carries across a roaring winch room or a silent night approach. Signers phrase their messages for the moving eye, not the page.

      - **Prerequisite:** the signer must know Harbor Sign.
      - **Use:** deliver and read moving sign phrases at a distance.
      - **Time:** about ten seconds per phrase.
      - **Penalty:** -2 when the sightline is intermittently obstructed.
    procedures:
      modifiers:
      - id: silent_signing_obstacle
        label: The sightline is intermittently obstructed
        when:
        - input:
            domain: environment
            key: silent_signing_obstacle
            label: The sightline is intermittently obstructed
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: silent_signing_task
        label: Deliver a moving sign phrase
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 10
          unit: seconds
        outcomes:
        - kind: note
          text: The GM determines which sign-literate observers receive the short phrase clearly.
          'on': success
        - kind: note
          text: The phrase is ambiguous or unseen; the GM resolves misunderstanding or observation manually.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
    key: skills_47
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.47
    source: LCST skills.47
    prerequisites: Knows Harbor Sign at any fluency.
  - name: Bell Tuning
    attribute: IQ
    difficulty: A
    defaults:
    - kind: attribute
      attribute: IQ
      modifier: -5
    - kind: skill
      name: Signal Weaving
      specialization:
        kind: any
      modifier: -4
    description: |-
      Every bell on the coast has its own voice. A cracked hanger or a warped lip changes that voice, and with it the meaning of every signal.

      - **Tech level required.**
      - **Use:** compare and adjust signal bells against a reference tone.
      - **Time:** about thirty minutes per adjustment.
      - **Penalty:** -2 when heavy harbor noise obscures the reference.
    procedures:
      modifiers:
      - id: bell_tuning_obstacle
        label: Heavy harbor noise obscures the reference
        when:
        - input:
            domain: environment
            key: bell_tuning_obstacle
            label: Heavy harbor noise obscures the reference
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: bell_tuning_task
        label: Tune a signal bell
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 30
          unit: minutes
        outcomes:
        - kind: note
          text: The GM records an ordinary bell tone that matches the available reference within practical limits.
          'on': success
        - kind: note
          text: The tone remains wrong or the adjustment risks damage; the GM decides rework manually.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
    key: skills_48
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.48
    source: LCST skills.48
    techLevelPolicy:
      kind: required
  spells:
  - name: Glimmer Shoal
    college: Beacon Light
    difficulty: H
    baseEnergyCost: 2
    castingTime: 2 seconds
    duration: 90 seconds
    description: |-
      A school of thumb-sized glimmers circles a marked rope, buoy or lantern hook, lighting a working space and marking it for anyone watching from the water.

      - **Effect:** bright light in a 2-yard radius around the marked object; it does not light a whole room.
      - **Use:** often cast to mark a safe line through a dark cave or across a deck.
    maintenanceCost: 1
    key: spells_1
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.1
    source: LCTR spells.1
    prerequisites: Tideglass attunement 1
  - name: Ember Thread
    college: Hearthcraft
    difficulty: H
    baseEnergyCost: 2
    castingTime: 3 seconds
    duration: 20 seconds
    description: |-
      A warm red filament threads through damp tinder, wicks or a frozen lock until it dries.

      - **Effect:** dries one small object, such as a knot of tinder, a wick or a powder charge, enough to burn or work normally.
      - **Limits:** it cannot ignite anything by itself or warm a person.
    key: spells_2
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.2
    source: LCTR spells.2
    prerequisites: Tideglass attunement 1
  - name: Borrowed Dawn
    college: Tide Vitality
    difficulty: H
    baseEnergyCost: 3
    castingTime: 4 seconds
    duration: Instant
    description: |-
      The caster gives an ally the rest they did not get: a breath of dawn passed hand to hand.

      - **Effect:** the caster pays the energy and a willing, touched subject recovers 2 FP.
      - **Limits:** one casting per subject per hour.
    key: spells_3
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.3
    source: LCTR spells.3
    prerequisites: Tideglass attunement 1
  - name: Stitch the Salt
    college: Tide Vitality
    difficulty: H
    baseEnergyCost: 2
    castingTime: 5 seconds
    duration: Instant
    description: |-
      Luminous thread draws salt and grit from a shallow wound and closes it cleanly.

      - **Effect:** heals 1 HP of cutting, impaling or abrasion injury from the last hour, and removes any infection risk from that wound.
      - **Limits:** once per wound; deep wounds need Mend the Undertow.
    key: spells_4
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.4
    source: LCTR spells.4
    prerequisites: Tideglass attunement 1
  - name: Mend the Undertow
    college: Tide Vitality
    difficulty: VH
    baseEnergyCost: 4
    castingTime: 8 seconds
    prerequisites: Tideglass attunement 1; Stitch the Salt
    duration: Instant
    description: |-
      The caster reads a wound's reflection in a bowl of seawater and draws the injured flesh back into the shape it remembers.

      - **Effect:** heals 1d HP to a touched subject.
      - **Limits:** no regrowth of lost limbs; casting time is long enough that it is rarely cast in combat.
    key: spells_5
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.5
    source: LCTR spells.5
  - name: Breakwater Veil
    college: Shelter
    difficulty: H
    baseEnergyCost: 3
    castingTime: 2 seconds
    duration: 45 seconds
    description: |-
      A translucent ribbon of tideglass light wraps the subject's guard, catching blows at the last moment.

      - **Effect:** +1 to all active defenses for the duration.
      - **Maintain:** for the listed cost each 45 seconds.
    maintenanceCost: 2
    key: spells_6
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.6
    source: LCTR spells.6
    prerequisites: Tideglass attunement 1; Glimmer Shoal
  - name: Wake Compass
    college: Wayfinding
    difficulty: H
    baseEnergyCost: 2
    maintenanceCost: 1
    castingTime: 3 seconds
    duration: 4 minutes
    description: |-
      A floating needle of light points toward a mooring post, jetty or anchor stone the caster has personally touched.

      - **Effect:** gives direction (not distance) to the chosen mooring, within one mile.
      - **Limits:** it never points to a place the caster has not touched.
    key: spells_7
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.7
    source: LCTR spells.7
    prerequisites: Tideglass attunement 1
  - name: Quiet Mooring
    college: Shelter
    difficulty: H
    baseEnergyCost: 3
    maintenanceCost: 1
    castingTime: 6 seconds
    duration: 3 minutes
    description: |-
      Ropes stop creaking, timbers stop groaning and the hull settles quietly against the jetty.

      - **Effect:** silences the structural noises of one tied vessel or small building: -4 to Hearing rolls to detect it by its creaks.
      - **Limits:** voices, footsteps and splashes remain audible.
    key: spells_8
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.8
    source: LCTR spells.8
    prerequisites: Tideglass attunement 1
  - name: Glasswake Message
    college: Beacon Light
    difficulty: VH
    baseEnergyCost: 5
    maintenanceCost: 2
    castingTime: 10 seconds
    duration: 2 minutes
    description: |-
      Two prepared tideglass mirrors share a single image for a few heartbeats: a face, a map, a signal.

      - **Requires:** a Tideglass mirror at each end, both prepared by the same caster.
      - **Effect:** sends one still image to the paired mirror at any distance on the same coast.
      - **Limits:** the receiver must be watching the mirror; nothing is recorded.
    key: spells_9
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.9
    source: LCTR spells.9
    prerequisites: Tideglass attunement 2; Glimmer Shoal; Wake Compass
  - name: Root the Jetty
    college: Shorecraft
    difficulty: H
    baseEnergyCost: 3
    maintenanceCost: 1
    castingTime: 4 seconds
    duration: 75 seconds
    description: |-
      Spectral roots rise from the pilings and grip loose planks, stones and ropes until the spell ends.

      - **Effect:** binds one 2-yard section of jetty, bridge or scaffold so that it holds as if properly fastened.
      - **Limits:** it cannot create timber or hold more than the structure was built to bear.
    key: spells_10
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.10
    source: LCTR spells.10
    prerequisites: Tideglass attunement 1; Quiet Mooring
  - name: Fogbank Lantern
    college: Beacon Light
    difficulty: H
    baseEnergyCost: 3
    castingTime: 2 seconds
    prerequisites: Tideglass attunement 1; Glimmer Shoal
    duration: 1 minute
    description: |-
      The keepers' answer to sea fog: a ruddy lantern-light that the mist cannot swallow.

      - **Effect:** reduces vision penalties from fog and mist by up to 3 within 5 yards of the caster.
      - **Maintain:** for the listed cost each minute.
    maintenanceCost: 1
    key: lc_fogbank_lantern
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.11
    source: LCTR spells.11
  - name: Brine Ward
    college: Tide Vitality
    difficulty: H
    baseEnergyCost: 2
    castingTime: 3 seconds
    prerequisites: Tideglass attunement 1; Stitch the Salt
    duration: 1 day
    description: |-
      A thin film of salt-light seals a dressed wound against the damp and the rot.

      - **Effect:** a treated wound cannot become infected for one day.
      - **Limits:** does not heal; it protects a wound that has already been cleaned.
    key: lc_brine_ward
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.12
    source: LCTR spells.12
  - name: Keeper's Lamp
    college: Hearthcraft
    difficulty: H
    baseEnergyCost: 1
    castingTime: 1 second
    prerequisites: Tideglass attunement 1; Ember Thread
    duration: 1 hour
    description: |-
      Every keeper learns this first: a lamp that burns without oil through the longest watch.

      - **Effect:** a touched lamp or lantern burns at normal brightness with no fuel for one hour.
      - **Limits:** the flame is real enough to light, but not hot enough to cook or set fires.
    key: lc_keepers_lamp
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.13
    source: LCTR spells.13
  - name: Still the Swell
    college: Shorecraft
    difficulty: H
    baseEnergyCost: 4
    castingTime: 10 seconds
    prerequisites: Tideglass attunement 1; Quiet Mooring
    duration: 1 minute
    description: |-
      The caster lays both palms on the water and the chop flattens in a widening ring.

      - **Effect:** calms waves within a 5-yard radius: -2 to boat-handling penalties caused by rough water there.
      - **Maintain:** for the listed cost each minute.
      - **Limits:** no effect on currents or tides.
    maintenanceCost: 2
    key: lc_still_the_swell
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.14
    source: LCTR spells.14
  - name: Read the Wake
    college: Wayfinding
    difficulty: H
    baseEnergyCost: 2
    castingTime: 5 seconds
    prerequisites: Tideglass attunement 1; Wake Compass
    duration: Instant
    description: |-
      The caster trails a hand in the water behind a vessel and feels every keel that has passed in the last hour.

      - **Effect:** learn the number, rough size and direction of boats that passed within 10 yards in the last hour.
      - **Limits:** gives no names or cargo.
    key: lc_read_the_wake
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.15
    source: LCTR spells.15
  - name: Hush the Bell
    college: Shelter
    difficulty: H
    baseEnergyCost: 2
    castingTime: 2 seconds
    prerequisites: Tideglass attunement 1; Quiet Mooring
    duration: 1 minute
    description: |-
      A whispered word muffles a bell's voice until the spell lapses.

      - **Effect:** a bell up to the size of a harbor alarm makes no sound when struck.
      - **Limits:** the caster must see the bell; the spell is useless against a bell already ringing.
    maintenanceCost: 1
    key: lc_hush_the_bell
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: spells.16
    source: LCTR spells.16
  languages:
  - name: Coast Common
    description: |-
      The everyday tongue of quays, ferries and markets from Greyhaven to the southern shoals, salted with sailing terms and borrowed words from every ship that has ever docked.

      - **Spoken and written.** Every Lantern Coast native speaks it.
    key: languages_1
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: languages.1
    source: LCGV languages.1
  - name: Old Beacon Script
    description: |-
      The angular script carved on beacon lintels and tide gates three centuries ago. Nobody has spoken it as a living language in generations; scholars argue over how it sounded.

      - **Mostly written.** Spoken fluency is reconstructed and rarely better than Broken.
      - **Use:** reading inscriptions, archive copies and old keeper's logs.
    key: languages_2
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: languages.2
    source: LCGV languages.2
  - name: Harbor Sign
    isSignLanguage: true
    description: |-
      A sign language developed by dock crews to be read across a roaring winch room or a silent night approach. Phrases are broad and visible from a distance.

      - **Signed only;** it has no written form.
      - **Use:** required for Silent Signing.
    key: languages_3
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: languages.3
    source: LCGV languages.3
  - name: Reedmarsh Cant
    isSignLanguage: false
    description: |-
      The clipped trade cant of the Reedmarsh villages, half Coast Common and half older marsh words. Outsiders hear it as mumbling, which suits the marsh folk well.

      - **Spoken only.**
      - **Use:** marsh guides, distillers and boat-builders speak it among themselves.
    key: lc_reedmarsh_cant
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: languages.4
    source: LCGV languages.4
  - name: Tidesong
    isSignLanguage: false
    description: |-
      The wordless, rising-and-falling song selkie-blooded families use to call to one another across open water. A few fishing crews have learned enough to warn of rocks and weather.

      - **Spoken only;** it carries well over water and poorly over land.
    key: lc_tidesong
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: languages.5
    source: LCGV languages.5
  techniques:
  - name: False Lantern Step
    defaultSkillName: Quayblade
    difficulty: H
    defaultModifier: -1
    maxLevel: 3
    description: |-
      Greyhaven guards carry lanterns on night patrol. The False Lantern Step swings the light one way while the blade comes from the other.

      - **Default:** Quayblade-1; can be bought up to Quayblade+2.
      - **Use:** a deceptive attack; the defender rolls against the technique's level as a Quick Contest of skill before choosing a defense.
    key: techniques_1
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: techniques.1
    source: LCST techniques.1
  - name: Hook the Haft
    defaultSkillName: Salvage Haft
    difficulty: H
    defaultModifier: -2
    maxLevel: 4
    description: |-
      A salvage hook catches behind an opponent's haft or crossguard and wrenches it out of line.

      - **Default:** Salvage Haft-2; can be bought up to Salvage Haft+2.
      - **Use:** a disarm attempt with a hooked weapon: roll against the technique instead of the skill.
    key: techniques_2
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: techniques.2
    source: LCST techniques.2
  - name: Breakwater Bind
    defaultSkillName: Bulwark Handling
    difficulty: H
    defaultModifier: -3
    maxLevel: 3
    description: |-
      The buckler's iron rim pins a weapon against the wall or rail long enough for a companion to strike.

      - **Default:** Bulwark Handling-3; can be bought up to full Bulwark Handling.
      - **Use:** after a successful block, roll against this technique to bind the attacking weapon until the attacker breaks free (Quick Contest of ST).
    key: lc_breakwater_bind
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: techniques.3
    source: LCST techniques.3
  - name: Low Haft Sweep
    defaultSkillName: Salvage Haft
    difficulty: A
    defaultModifier: -3
    maxLevel: 3
    description: |-
      A low swing of the haft behind the knee: the quay fighter's favorite way to put someone in the water.

      - **Default:** Salvage Haft-3; can be bought up to full Salvage Haft.
      - **Use:** a sweep attack against the legs; a hit forces a DX roll to stay standing instead of dealing damage.
    key: lc_low_haft_sweep
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: techniques.4
    source: LCST techniques.4
  - name: Tether Snare
    defaultSkillName: Tether Cast
    difficulty: H
    defaultModifier: -2
    maxLevel: 2
    description: |-
      A weighted line cast low wraps around an ankle or an oar.

      - **Default:** Tether Cast-2; can be bought up to full Tether Cast.
      - **Use:** a cast at the legs or a held object; a hit entangles the target until they spend a turn and a DX roll to free themselves.
    key: lc_tether_snare
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: techniques.5
    source: LCST techniques.5
  - name: Running Shot
    defaultSkillName: Reedbow
    difficulty: H
    defaultModifier: -4
    maxLevel: 3
    description: |-
      Coast scouts shoot from moving boats and shifting shingle and learn to time a release between strides.

      - **Default:** Reedbow-4; can be bought up to Reedbow-1.
      - **Use:** removes part of the penalty for shooting while moving; roll against this technique instead of Reedbow.
    key: lc_running_shot
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: techniques.6
    source: LCST techniques.6
  - name: Close-Quarter Rod
    defaultSkillName: Beacon Rod
    difficulty: A
    defaultModifier: -2
    maxLevel: 2
    description: |-
      Keepers fight on narrow lighthouse stairs. They choke up on the rod and jab with the ferrule.

      - **Default:** Beacon Rod-2; can be bought up to full Beacon Rod.
      - **Use:** offsets the penalty for using a long rod in a tight space or at close range.
    key: lc_close_quarter_rod
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: techniques.7
    source: LCST techniques.7
  styles:
  - name: Greyhaven Watch
    description: |-
      The Greyhaven harbor watch trains on the breakwater itself: sword and buckler on a wet wall, a lantern in the off hand at night, and a lookout's eye between bouts.

      **Teaches:** Quayblade, Bulwark Handling and Horizon Watch, with False Lantern Step and Breakwater Bind.
    skills:
    - Quayblade
    - Bulwark Handling
    - Horizon Watch
    techniques:
    - name: False Lantern Step
      defaultSkillName: Quayblade
    - name: Breakwater Bind
      defaultSkillName: Bulwark Handling
    perks:
    - Lantern Guard
    key: styles_1
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: styles.1
    source: LCST styles.1
  - name: Stonebridge Hafters
    description: |-
      The Stonebridge masons' guild has fought for its crossings since before the town had walls. Their style uses a work haft and a buckler, and wins by putting the enemy in the river.

      **Teaches:** Salvage Haft, Bulwark Handling and Dockside Scrapping, with Hook the Haft, Low Haft Sweep and Breakwater Bind.
    skills:
    - Salvage Haft
    - Bulwark Handling
    - Dockside Scrapping
    techniques:
    - name: Hook the Haft
      defaultSkillName: Salvage Haft
    - name: Low Haft Sweep
      defaultSkillName: Salvage Haft
    - name: Breakwater Bind
      defaultSkillName: Bulwark Handling
    perks:
    - Shield-Wall Training
    - Haft Retention
    key: lc_stonebridge_hafters
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: styles.2
    source: LCST styles.2
  - name: Reedwake Lifeline
    description: |-
      Reedwake ferry crews are rescuers first. The lifeline drills teach them to throw, snare and haul from a moving deck, and to fight only long enough to get everyone aboard.

      **Teaches:** Tether Cast, Ropework, Current Riding and Smallcraft Sailing, with Tether Snare.
    skills:
    - Tether Cast
    - Ropework
    - Current Riding
    - Smallcraft Sailing
    techniques:
    - name: Tether Snare
      defaultSkillName: Tether Cast
    perks:
    - Deck Footing
    key: lc_reedwake_lifeline
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: styles.3
    source: LCST styles.3
  enchantments:
  - name: Beacon Edge
    description: |-
      A warm streak of beacon light follows the edge through every cut.

      - **On the sheet:** +1 damage with the enchanted weapon while it is equipped.
    applicability: weapon
    effects:
    - target: weapon_damage
      value: 1
    stackingPolicy:
      kind: stack
    key: enchantments_1
    sourceKey: lantern_rites
    status: complete
    role: definition
    sourceLocator: enchantments.1
    source: LCTR enchantments.1
  - name: Warden's Stitch
    description: |-
      Tidewire stitched into the seams stiffens the instant something strikes it.

      - **On the sheet:** +1 DR on the enchanted armor's locations while it is worn.
      - **Stacking:** several Warden's Stitches on overlapping armor do not add; only the highest applies.
    applicability: armor
