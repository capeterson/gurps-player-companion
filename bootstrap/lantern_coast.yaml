    attribute: DX
    difficulty: E
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -4
    description: Control the coast's small bucklers, redirect an incoming blow, and carry a shield through a
      crowded gangway. Blocking uses the sheet defense calculated from this skill and the actual shield, not
      a second flat defense bonus. An attack with the buckler takes the normal combat turn and uses its listed
      mode. In cramped rigging, apply the selected handling penalty; the GM adjudicates loss of footing and which
      attacks can be blocked.
