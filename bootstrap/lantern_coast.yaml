  - name: Echo Collector
    kind: disadvantage
    basePoints: -6
    availableModifiers:
    - name: Trusted companion intervenes
      category: limitation
      costType: percent
      costValue: -30
    description: An unfamiliar beacon echo demands a pause to sketch its rhythm, normally ten minutes if recording
      is safe. In a chase or rising tide, the player must explain restraint or accept the delay; the GM resolves
      the compulsion and consequences rather than the app rolling self-control. A purchased Trusted companion
      intervenes limitation lets the named companion interrupt this pause with a direct warning, not erase the
      interest permanently. Recording an echo supplies a clue, never an automatic Beacon Resonance success or
      a free spell.
