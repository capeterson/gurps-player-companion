  - name: Shingle Ghosting
    attribute: DX
    difficulty: A
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -5
    description: Move quietly between nearby cover on a shingle beach, tidal stair, or cluttered quay. A short
      crossing normally takes a minute; a lookout contest uses the existing Slip past the lookout action against
      Horizon Watch. Loose shingle applies the declared -2 task modifier, and choosing speed does not erase that
      penalty. Success gives a chance to reach cover, not invisibility or passage through a locked gate. The
      GM adjudicates observers, available cover, travel distance, and any alarm manually; the practiced-scout
      milestone adds no numerical bonus.
    procedures:
      modifiers:
      - id: noisy_ground
        label: Loose shingle underfoot
        when:
