  - name: Horizon Reader
    kind: advantage
    basePoints: 0
    pointsPerLevel: 3
    maxLevel: 5
    description: |-
      A horizon reader can tell a beacon's interval from a reflection on the swell, a fishing lantern from a signal, and a signal from a lure.

      - **On the sheet:** +1 Horizon Watch per level, up to five levels (3 points per level).
      - **In play:** interpreting a suspicious light takes Horizon Watch's normal minute-long sweep.
      - **Limits:** only Horizon Watch improves; Perception and other sense rolls are unchanged.
    effects:
    - target: skill
      skillName: Horizon Watch
      value: 1
      scaling: per_level
    key: traits_3
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: traits.3
    source: LCGV traits.3
  - name: Magery (Tideglass attunement)
    kind: advantage
    basePoints: 7
    pointsPerLevel: 9
    maxLevel: 3
    effects:
    - target: skill
      skillName: Beacon Resonance
      value: 1
      scaling: per_level
    description: |-
      Tideglass answers some people the way a tuning fork answers a struck note. The attunement runs in families and coastal towns, and Greyhaven's archive keepers have catalogued it for two centuries.

      - **Cost:** 7 points, plus 9 points per level, up to level 3.
      - **On the sheet:** each level adds to spell levels and enables spells under the campaign's mana; each level also grants +1 Beacon Resonance.
      - **In play:** spells are still learned individually, pay their full energy cost, and meet their own prerequisites.
      - **Limits:** aptitude, not knowledge; the attunement does not reveal which spells a beacon carries.
    tags:
    - beacon
    key: traits_4
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: traits.4
    source: LCGV traits.4
  - name: Stoneblood
    kind: advantage
    basePoints: 6
    description: |-
      The old quarry families of Greyhaven are said to have stone in their blood. Their skin carries a faint mineral sheen that shrugs off scrapes and splinters.

      - **On the sheet:** innate DR 1 on every location, layered beneath worn armor.
      - **In play:** quarry families recognize the sheen; strangers may remember it too.
      - **Limits:** no extra ST, healing or immunity; weak points and armor divisors still apply.
