        time:
          amount:
            kind: constant
            value: 1
          unit: minutes
        outcomes:
        - kind: note
          text: The GM sets progress toward the chosen safe point and records any exertion manually.
          'on': success
        - kind: note
          text: Progress is lost or the swimmer drifts; the GM decides the rescue and fatigue consequences.
          'on': failure
