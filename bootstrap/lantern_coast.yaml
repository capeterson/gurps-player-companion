# Original synthetic coastal fantasy fixtures; all sourcebooks and locators are fictional.
version: 15
campaign:
  name: The Lantern Coast
  description: |-
    Greyhaven's beacon has gone dark, its keeper Fen has vanished, and lanterns are burning in the sea caves below the cliffs where no lantern should be. Six companions bound by the Greyhaven charter follow the light down into the tide.

    A low-magic coastal fantasy at TL3: ferries and shoals, bell towers and salt gardens, and tideglass wards older than the town.
  pointTarget: 250
  disadvantageCap: 50
  quirkCap: 5
  manaLevel: normal
  techLevel: 3
  skillPrerequisitePolicy: warn
  enforceAttributeCaps: true
  houseRules:
    ruleSet: none
    protectNaturalDr: false
library:
  traits:
  - name: Breakwater Poise
    kind: advantage
    basePoints: 12
    effects:
    - target: parry
      value: 1
    - target: will
      value: 1
    description: |-
      Breakwater guards learn to fight on a wall barely wider than their boots, with spray in their eyes and a storm at their backs. The stance keeps the blade low and the mind steady.

      - **On the sheet:** +1 Parry with every weapon and +1 Will, already included in both totals.
      - **In play:** a minute of demonstration can teach a companion the stance's name, but not its benefit.
      - **Limits:** no extra defenses, no immunity to surprise; footing and fear circumstances still apply.
    key: traits_1
    sourceKey: lantern_lives
    status: complete
    role: definition
    calculation:
      version: 1
      inputs: []
      tables: []
      nodes:
      - id: points
        op: constant
        value: 12
