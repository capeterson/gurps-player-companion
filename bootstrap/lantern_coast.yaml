  skills:
  - name: Quayblade
    attribute: DX
    difficulty: A
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -5
    description: |-
      The quayblade is a short, broad coastal sword built for fighting where there is no room to swing: narrow quays, ship rails and crowded stairs.

      - **Use:** melee attacks and parries with any quayblade-class weapon; damage, reach and parry come from the weapon row.
      - **Time:** one attack per turn; studying an opponent's guard takes about a minute.
      - **Penalty:** -2 when tangled mooring lines restrict the weapon.
    key: skills_1
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.1
    source: LCST skills.1
    procedures:
      modifiers:
      - id: quayblade_obstacle
        label: Tangled mooring lines restrict the weapon
        when:
        - input:
            domain: environment
            key: quayblade_obstacle
            label: Tangled mooring lines restrict the weapon
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: quayblade_task
        label: Make a quayblade attack
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 1
          unit: seconds
        outcomes:
        - kind: note
          text: Resolve the chosen weapon mode and target defense through normal combat; injury is recorded there.
          'on': success
        - kind: note
          text: The strike misses or is defended against; the GM resolves any critical mishap.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
  - name: Bulwark Handling
    attribute: DX
    difficulty: E
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -4
    description: |-
      Breakwater guards carry a small iron-rimmed buckler that blocks spray as readily as steel, and punches nearly as hard.

      - **Use:** block with a buckler or shield, or strike with its rim using the item's own attack mode.
      - **Time:** one action per turn.
      - **Penalty:** -2 when rigging or a crowded rail obstructs the shield arm.
    key: skills_2
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.2
    source: LCST skills.2
    procedures:
      modifiers:
      - id: bulwark_handling_obstacle
        label: Rigging obstructs the shield arm
        when:
        - input:
            domain: environment
            key: bulwark_handling_obstacle
