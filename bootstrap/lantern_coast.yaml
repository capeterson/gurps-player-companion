        node: points
        unit: points
        rounding: exact
        increment: 1
        min: -1000
        max: 1000
    sourceLocator: traits.1
    source: LCGV traits.1
  - name: Longwatch Lungs
    kind: advantage
    basePoints: 7
    description: |-
      Keepers of the long watch train their breathing on the lighthouse stairs, two hundred steps at a measured pace, until exertion stops stealing the night.

      - **On the sheet:** +1 FP, already included in the maximum.
      - **In play:** spend the extra FP on exertion, extra effort or spellcasting like any other.
      - **Limits:** this is stamina, not water-breathing; smoke, drowning and recovery time follow normal rules.
    effects:
    - target: fp
      value: 1
