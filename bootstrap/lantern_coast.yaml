          changes manually.
  - name: Cliff Traverse
    attribute: DX
    difficulty: A
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -5
    description: |-
      Cliff traverse is sideways climbing along sea cliffs between the tide line and the heather, the only way to reach many caves and nesting ledges.

      - **Use:** climb and traverse rock faces, sea walls and rigging.
      - **Time:** about ten minutes per marked pitch.
      - **Penalty:** -2 when holds are wet or crumbling.
