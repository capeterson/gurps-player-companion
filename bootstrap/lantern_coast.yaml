    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.2
    source: LCST skills.2
    procedures:
      modifiers:
      - id: bulwark_handling_obstacle
        label: Rigging obstructs the shield arm
        when:
        - input:
            domain: environment
            key: bulwark_handling_obstacle
            label: Rigging obstructs the shield arm
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
