        - kind: note
          text: An important detail may be missed or misidentified; the GM describes uncertainty manually.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
  - name: Current Riding
    attribute: HT
    difficulty: E
    defaults:
    - kind: attribute
      attribute: HT
      modifier: -4
    description: |-
      Coast children learn to ride a current before they learn to fight one: angle across it, rest in the eddies and never swim straight against the pull.

      - **Use:** cross rips, channel currents and surf without being swept away.
      - **Time:** one minute for a short crossing.
      - **Penalty:** -2 when a strong current opposes the route.
