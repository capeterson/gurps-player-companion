        min: -1000
        max: 1000
    sourceLocator: traits.2
    source: LCGV traits.2
  - name: Horizon Reader
    kind: advantage
    basePoints: 0
    pointsPerLevel: 3
    maxLevel: 5
    description: Practice distinguishing beacon intervals from reflections grants +1 Horizon Watch per purchased
      level, up to five levels. The bonus applies to that skill alone, including a mundane lookout task; it never
      raises general Perception or defeats concealment automatically. Interpreting a suspicious interval takes
      the time specified by Horizon Watch. A false identification still needs confirmation by signal or approach,
      and the GM supplies only information the observer could see.
    effects:
    - target: skill
      skillName: Horizon Watch
      value: 1
      scaling: per_level
    key: traits_3
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: traits.3
    source: LCGV traits.3
  - name: Magery (Tideglass attunement)
    kind: advantage
    basePoints: 7
    pointsPerLevel: 9
    maxLevel: 3
    effects:
    - target: skill
      skillName: Beacon Resonance
      value: 1
      scaling: per_level
    description: 'The fictional tideglass tradition costs 7 points plus 9 per level, to a maximum of three levels.
      Its Magery name participates in the sheet''s existing spell-level and mana gate, and each level also grants
      +1 Beacon Resonance. This is aptitude, not knowledge: learn spells separately, pay their stated energy,
      and respect their range, duration, and prerequisites. Beacon Resonance can diagnose a ward during a ten-minute
      examination; it cannot substitute for a spell, confer ownership of a beacon, or authorize a dangerous rite.
      The GM adjudicates access to instruction and phenomena the spell system cannot represent.'
    tags:
    - beacon
    key: traits_4
    sourceKey: lantern_lives
    status: complete
    role: definition
    sourceLocator: traits.4
    source: LCGV traits.4
  - name: Stoneblood
    kind: advantage
    basePoints: 6
    description: A mineral sheen marks a Greyhaven quarry lineage. The sheet grants innate DR 1; no extra strength,
      healing, immunity to crushing, or protection beyond that DR is implied. The visible sheen can identify
      the character to quarry families or an investigator, which is a manually adjudicated social consequence
      rather than a reaction modifier. Damage, armor layering, and any exposed weak point still follow ordinary
      combat rules.
    effects:
    - target: dr
      value: 1
    key: traits_5
    sourceKey: lantern_lives
    status: complete
    role: definition
