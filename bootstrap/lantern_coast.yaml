    description: |-
      Every sailor knows a dozen knots. A ropeworker knows which one will hold a person, which will release under load, and which will jam forever.

      - **Use:** tie load-bearing knots, rig lines and lifts.
      - **Time:** about five minutes to prepare a load-bearing line.
      - **Penalty:** -2 when the rope is frayed.
      - **Benefit:** at relative level +2, sustained practice grants +1 Net Mending.
