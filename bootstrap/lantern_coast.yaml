  sources:
  - name: Greyhaven Lives and Vows
    key: lantern_lives
    abbreviation: LCGV
    edition: First edition
    priority: 0
    notes: 'The people of the Lantern Coast: their vows, debts, privileges and peculiar habits, with racial templates
      for the Shoalborn and the selkie-blooded. Written for this campaign; not a published GURPS book.'
  - name: The Shoalwatch Training Almanac
    key: lantern_training
    abbreviation: LCST
    edition: First edition
    priority: 1
    notes: Harbor-watch drills, coastal trades and fighting styles taught on the quays of Greyhaven and Stonebridge.
      Written for this campaign; not a published GURPS book.
  - name: Tideglass Rites and Resonances
    key: lantern_rites
    abbreviation: LCTR
    edition: First edition
    priority: 2
    notes: 'Tideglass magic: the beacon colleges, enchantments and wards of the coast''s keepers. Written for
      this campaign; not a published GURPS book.'
  - name: The Quaywright’s Outfit Ledger
    key: lantern_outfits
    abbreviation: LCQO
    edition: First edition
    priority: 3
    notes: Arms, armor and kit from the coast's chandlers, armorers and tideglass workshops. Written for this
      campaign; not a published GURPS book.
