  skills:
  - name: Quayblade
    attribute: DX
    difficulty: A
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -5
    description: Use a short coastal sword in close combat and practice safe passing drills on a narrow quay.
      One attack uses the normal combat turn; an examination of a guard's stance takes a minute. The weapon row
      supplies damage, reach, and parry, so this skill adds no separate damage or defense bonus. Fighting amid
      tangled mooring lines uses the declared task penalty; the GM resolves footing, target defenses, and a dropped
      weapon.
    key: skills_1
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.1
    source: LCST skills.1
    procedures:
      modifiers:
      - id: quayblade_obstacle
        label: Tangled mooring lines restrict the weapon
        when:
        - input:
            domain: environment
            key: quayblade_obstacle
            label: Tangled mooring lines restrict the weapon
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: quayblade_task
        label: Make a quayblade attack
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 1
          unit: seconds
        outcomes:
        - kind: note
          text: Resolve the chosen weapon mode and target defense through normal combat; injury is recorded there.
          'on': success
        - kind: note
          text: The strike misses or is defended against; the GM resolves any critical mishap.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
