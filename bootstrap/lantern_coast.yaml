    kind: advantage
    basePoints: 8
    description: Years on rolling decks and wet ladders grant +1 Current Riding and +1 Cliff Traverse, already
      reflected in those effective skills. The trait does not increase Dodge, Move, or every DX roll. It does
      not cancel a task penalty for a slick surface, an impossible handhold, a dangerous current, or excess load.
