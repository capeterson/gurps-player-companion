    source: LCST skills.44
  - name: Tidepool Lore
    attribute: IQ
    difficulty: A
    defaults:
    - kind: attribute
      attribute: IQ
      modifier: -5
    - kind: skill
      name: Coastal Foraging
      specialization:
        kind: any
      modifier: -3
    description: Identify ordinary tidepool creatures, their local habitats, and common signs of a disturbed
      shore. An accessible pool takes ten minutes of careful observation. An unfamiliar seasonal species gives
      the penalty. Success suggests a plausible identification, not animal control, safe eating, or the effect
      of a magical specimen. The GM resolves uncertainty, ecological clues, and whether further samples or another
      expert are needed.
    procedures:
      modifiers:
      - id: tidepool_lore_obstacle
        label: The seasonal species is unfamiliar
        when:
        - input:
            domain: familiarity
            key: tidepool_lore_obstacle
            label: The seasonal species is unfamiliar
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: tidepool_lore_task
        label: Inspect a tidepool community
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 10
          unit: minutes
        outcomes:
        - kind: note
          text: The GM provides a plausible local identification or an ecological clue.
          'on': success
        - kind: note
          text: The specimen is misidentified or unresolved; the GM records uncertainty rather than a guaranteed
            answer.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
    key: skills_45
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.45
    source: LCST skills.45
  - name: Storm Drill
    attribute: IQ
    difficulty: A
    defaults:
    - kind: attribute
      attribute: IQ
      modifier: -5
    - kind: skill
      name: Harbor Winchcraft
      specialization:
        kind: any
      modifier: -4
    description: Organize a rehearsed crew response to a squall, including securing gear and identifying shelter.
      A briefing and short rehearsal take ten minutes with the actual team. An unfamiliar crew gives the penalty.
      Success establishes understood roles, not a bonus to every defense or immunity to storm damage. At relative
      level +2, repeated training grants the declared +1 Rescue Coordination benefit. The GM resolves actual
      performance, fatigue, lost equipment, and a missed instruction manually.
    procedures:
      modifiers:
      - id: storm_drill_obstacle
        label: The crew has not worked together before
        when:
        - input:
            domain: familiarity
            key: storm_drill_obstacle
            label: The crew has not worked together before
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: storm_drill_task
        label: Rehearse a storm response
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 10
          unit: minutes
        outcomes:
        - kind: note
          text: The GM records an understood plan and the next specific preparation step.
          'on': success
        - kind: note
          text: A role or safety step is missed; the GM identifies the gap before an actual storm.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
      benefits:
      - id: cross_training
        label: Practiced rescue coordination
        when:
          minimumRelativeLevel: 2
        effects:
        - target: skill
          skillName: Rescue Coordination
          value: 1
        sourceText: At relative level +2, sustained training grants +1 Rescue Coordination; no other skill receives
          this benefit.
    key: skills_46
    sourceKey: lantern_training
    status: complete
    role: definition
    sourceLocator: skills.46
    source: LCST skills.46
  - name: Silent Signing
    attribute: DX
    difficulty: A
    defaults:
    - kind: attribute
      attribute: DX
      modifier: -5
    - kind: skill
      name: Signal Weaving
      specialization:
        kind: any
      modifier: -4
    description: Keep a short Harbor Sign exchange visible while moving along a quay or peering from cover. One
      short phrase takes ten seconds. Harbor Sign comprehension is required as a manually checked language condition;
      this skill handles delivery and does not teach the language. An obstructed sightline gives the penalty.
      The GM adjudicates who can see and understand, ambiguous gestures, and whether a lookout notices the exchange.
    procedures:
      modifiers:
      - id: silent_signing_obstacle
        label: The sightline is intermittently obstructed
        when:
        - input:
            domain: environment
            key: silent_signing_obstacle
            label: The sightline is intermittently obstructed
          operator: equals
          value: true
        value:
          kind: fixed
          value: -2
        appliesTo: task_roll
        sourceText: Apply only when the player and GM confirm this circumstance for the current task.
      actions:
      - id: silent_signing_task
        label: Deliver a moving sign phrase
        roll:
          basis: skill
        time:
          amount:
            kind: constant
            value: 10
          unit: seconds
        outcomes:
        - kind: note
          text: The GM determines which sign-literate observers receive the short phrase clearly.
          'on': success
        - kind: note
          text: The phrase is ambiguous or unseen; the GM resolves misunderstanding or observation manually.
          'on': failure
        sourceText: The action previews a task roll; the GM resolves its outcome and records resources or physical
          changes manually.
