    kind: disadvantage
    basePoints: -9
    description: A storm-guild crew paid for the character's rescue and now holds first claim on reasonable salvage
      service. When a summons arrives, seek terms or a named substitute before accepting competing work; a routine
      duty normally occupies a watch rather than every adventure. A summons to certain death may be challenged
      openly, with the debt still unresolved. The GM sets schedules and social consequences, and records repayment
