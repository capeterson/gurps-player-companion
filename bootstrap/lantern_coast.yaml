    source: LCGV traits.5
  - name: Greyhaven Promise
    kind: disadvantage
    basePoints: -7
    description: After accepting a rescue, see the traveler to a genuinely safe harbor before taking unrelated
      paid work. This does not require a suicidal extraction, but a convenient delay or a richer offer is not
      grounds for abandonment. When routes conflict, spend a scene arranging an escort, shelter, or an agreed
      handover. The GM adjudicates whether safety and consent are real, and may introduce a broken promise as
      a damaged relationship or lost commission; the app does not enforce vows or apply a flat social penalty.
    key: traits_6
    sourceKey: lantern_lives
    status: complete
