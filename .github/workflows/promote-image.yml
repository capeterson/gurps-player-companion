name: Promote image

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source image tag in GHCR to promote (e.g. dev, sha-abc1234)"
        required: true
        default: dev
      version:
        description: "Semver to apply, no leading v (e.g. 1.2.3 or 1.2.3-rc.1)"
        required: true
      ref:
        description: "Git ref/SHA to tag and release from (defaults to the workflow ref)"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gurps
          POSTGRES_PASSWORD: gurps
          POSTGRES_DB: gurps_browser_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gurps -d gurps_browser_acceptance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      ENVIRONMENT: test
      DATABASE_URL: postgres://gurps:gurps@localhost:5432/gurps_browser_acceptance
      JWT_SECRET: release-gate-secret-which-is-deliberately-long-and-not-a-placeholder
      CORS_ORIGINS: '[]'
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      PORT: '3000'
      OAUTH_CLIENTS: '[{"clientId":"playwright-mcp","name":"Playwright MCP Agent","redirectUris":["http://localhost:3000/oauth/callback"],"scopes":["gpc:read","gpc:write","gpc:manage"]}]'
    steps:
      - name: Validate semver input
        env:
          VER: ${{ inputs.version }}
        run: |
          printf '%s\n' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "version must be MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-PRERELEASE"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure version is unused
        env:
          VER: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1; then
            echo "::error::git tag v$VER already exists"
            exit 1
          fi
          if docker buildx imagetools inspect "$IMAGE:v$VER" >/dev/null 2>&1; then
            echo "::error::image tag v$VER already exists in $IMAGE"
            exit 1
          fi

      - name: Install Chromium for release acceptance
        run: bunx playwright install --with-deps chromium

      - name: Start source image with an isolated database
        env:
          SRC: ${{ inputs.source }}
        run: |
          docker pull "$IMAGE:$SRC"
          docker run --rm --network host \
            --env ENVIRONMENT \
            --env DATABASE_URL \
            --env JWT_SECRET \
            --env CORS_ORIGINS \
            --env APP_BASE_URL \
            --env PORT \
            --env OAUTH_CLIENTS \
            "$IMAGE:$SRC" bun run dist/server/migrate.js
          docker run --rm --detach --name gpc-release-candidate --network host \
            --env ENVIRONMENT \
            --env DATABASE_URL \
            --env JWT_SECRET \
            --env CORS_ORIGINS \
            --env APP_BASE_URL \
            --env PORT \
            --env OAUTH_CLIENTS \
            "$IMAGE:$SRC"
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/api/v1/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs gpc-release-candidate
          exit 1

      - name: Browser OAuth, MCP, and offline convergence release gate
        run: >-
          MCP_E2E_BUILT_SERVER=1
          node node_modules/@playwright/test/cli.js test
          tests/e2e/mcp-oauth.spec.ts --project=chromium

      - name: Capture and stop release candidate
        if: always()
        run: |
          docker logs gpc-release-candidate > release-candidate.log 2>&1 || true
          docker rm --force gpc-release-candidate >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-browser-acceptance-results
          path: |
            test-results/
            release-candidate.log
          if-no-files-found: ignore

      - name: Create and push git tag
        env:
          VER: ${{ inputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VER" -m "Release v$VER"
          git push origin "v$VER"

      - name: Re-tag image in GHCR
        id: retag
        env:
          SRC: ${{ inputs.source }}
          VER: ${{ inputs.version }}
        run: |
          TAGS=( -t "$IMAGE:v$VER" -t "$IMAGE:$VER" )
          if [[ "$VER" != *-* ]]; then
            MM="${VER%.*}"
            TAGS+=( -t "$IMAGE:latest" -t "$IMAGE:$MM" )
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          fi
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE:$SRC"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.retag.outputs.prerelease == 'true' }}
