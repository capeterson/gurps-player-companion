name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gurps
          POSTGRES_PASSWORD: gurps
          POSTGRES_DB: gurps
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gurps -d gurps"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgres://gurps:gurps@localhost:5432/gurps
      JWT_SECRET: ci-secret-which-is-deliberately-very-long-and-not-a-placeholder
      CORS_ORIGINS: '[]'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run skills:check
      - run: bun run db:migrate
      - run: bun run test
      - run: bun run openapi:check
      - run: bun run mcp:check
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-timings
          path: .local/test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run test:client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-timings
          path: .local/test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  # Keep the existing required check name, and fail it if either suite fails or
  # is skipped/cancelled. Only the server job starts PostgreSQL.
  build:
    if: always()
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          SERVER_RESULT: ${{ needs.server.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
        run: test "$SERVER_RESULT" = success && test "$CLIENT_RESULT" = success
