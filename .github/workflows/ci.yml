name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gurps
          POSTGRES_PASSWORD: gurps
          POSTGRES_DB: gurps
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gurps -d gurps"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgres://gurps:gurps@localhost:5432/gurps
      JWT_SECRET: ci-secret-which-is-deliberately-very-long-and-not-a-placeholder
      CORS_ORIGINS: '[]'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun run test
      - run: bun run test:client
      - run: bun run openapi:check
      - run: bun run mcp:check
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Prepare isolated browser database
        run: >-
          bun -e 'import { Client } from "pg"; const db = new Client({ connectionString: process.env.DATABASE_URL }); await db.connect(); await db.query("CREATE DATABASE gurps_browser_acceptance"); await db.end();'
      - name: Browser OAuth, MCP, and offline convergence in dev and built app
        run: |
          bun run db:migrate
          node node_modules/@playwright/test/cli.js test tests/e2e/mcp-oauth.spec.ts --project=chromium
          MCP_E2E_BUILT_SERVER=1 node node_modules/@playwright/test/cli.js test tests/e2e/mcp-oauth.spec.ts --project=chromium
        env:
          DATABASE_URL: postgres://gurps:gurps@localhost:5432/gurps_browser_acceptance
          MCP_E2E_START_SERVER: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          APP_BASE_URL: http://localhost:3000
          PORT: '3000'
          OAUTH_CLIENTS: '[{"clientId":"playwright-mcp","name":"Playwright MCP Agent","redirectUris":["http://localhost:3000/oauth/callback"],"scopes":["gpc:read","gpc:write","gpc:manage"]}]'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-acceptance-results
          path: test-results/
          if-no-files-found: ignore
